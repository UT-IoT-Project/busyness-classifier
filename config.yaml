# Configuracion unica para entrenamiento e inferencia.

api:
  base_url: "http://IP-DE-LA-PI:8080"   # por completar
  building: "zilverling"                 # por completar
  room: "Z2402"                          # por completar

# Nombres exactos del contrato de la API (sensibles a mayusculas).
# Contrato de platform/docs/api/openapi.yaml, version del 30 de octubre.
sensors:
  - pirs
  - pressure
  - humidity
  - temperature
  - co2Equivalent
  - voc
  - iaq
  - mic_vol
  - wifiPackets
  - bleAdverts
  - busynessLabel

windows:
  size_minutes: 3     # ventana de 1 a 5 minutos (por decidir)
  step_seconds: 30    # cada cuanto se calcula una ventana nueva

cleaning:
  # Rejilla comun de tiempo (medida con los datos simulados; revisar con los reales)
  interval_seconds: 10

  # Etiqueta: nivel de ocupacion que pone una persona (0 = vacia ... 3 = muy ocupada).
  # Solo se comprueba el rango; no se le quitan picos, no se interpola ni se suaviza.
  label:
    sensor: busynessLabel
    min: 0
    max: 3

  # Etapa 1.2: control de rango (provisional, hasta tener hojas de datos y unidades)
  limits:
    temperature:   {min: -10, max: 50}
    humidity:      {min: 0,   max: 100}
    co2Equivalent: {min: 0,   max: 5000}
    pressure:      {min: 950, max: 1100}
    voc:           {min: 0,   max: .inf}
    iaq:           {min: 0,   max: 500}    # por confirmar que es un indice de 0 a 500
    mic_vol:       {min: 0,   max: 1}
    wifiPackets:   {min: 0,   max: 4294967295}
    bleAdverts:    {min: 0,   max: 4294967295}

  # Etapa 1.3: picos aislados (provisional, elegir con graficas de datos reales).
  # wifiPackets y bleAdverts no estan: son conteos y pueden saltar de verdad.
  spike_window_readings: 5
  spike_thresholds:
    temperature: 1
    humidity: 2
    pressure: 3
    co2Equivalent: 100
    voc: 0.5
    iaq: 100
    mic_vol: 0.3

  # Etapa 1.4: huecos
  max_gap_readings: 3

  # Etapa 1.5: suavizado (opcional; comparar el modelo con y sin)
  smoothing:
    enabled: true
    window_seconds: 30
    sensors: [mic_vol, co2Equivalent, voc]

model:
  path: "models/model.joblib"
