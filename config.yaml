# Single configuration for training and inference.

api:
  base_url: "http://PI-IP-ADDRESS:8080"  # to be filled in
  building: "zilverling"                 # to be filled in
  room: "Z2402"                          # to be filled in

# Exact names from the API contract (case-sensitive).
# Contract: platform/docs/api/openapi.yaml.
sensors:
  - pirs
  - pressure
  - humidity
  - temperature
  - co2Equivalent
  - voc
  - iaq
  - mic_vol
  - wifiPackets
  - bleAdverts
  - busy_level

windows:
  size_minutes: 3     # window of 1 to 5 minutes (to be decided)
  step_seconds: 30    # how often a new window is computed
  min_coverage: 0.8          # a sensor "has data" if it covers at least 80 % of the window
  min_sensor_fraction: 0.5   # window valid if at least half of the sensors have data
  # Sensors used to compute the features (always the same in training and
  # prediction; the PIRs are added separately and the label never)
  sensors: [pressure, humidity, temperature, co2Equivalent, voc, iaq, mic_vol, wifiPackets, bleAdverts]

cleaning:
  # Common time grid (measured on the simulated data; check with real data)
  interval_seconds: 10

  # Label: occupancy level set by a person (0 = unoccupied ... 3 = extremely busy).
  # Only the range is checked; no spike removal, interpolation or smoothing.
  label:
    sensor: busy_level
    min: 0
    max: 3

  # Step 1.2: range check (provisional, until we have datasheets and units)
  limits:
    temperature:   {min: -10, max: 50}
    humidity:      {min: 0,   max: 100}
    co2Equivalent: {min: 0,   max: 5000}
    pressure:      {min: 950, max: 1100}
    voc:           {min: 0,   max: .inf}
    iaq:           {min: 0,   max: 500}    # indoor air quality, 0 to 500
    mic_vol:       {min: 0,   max: 1}
    wifiPackets:   {min: 0,   max: 4294967295}
    bleAdverts:    {min: 0,   max: 4294967295}

  # Step 1.3: isolated spikes (provisional, choose with plots of real data).
  # wifiPackets and bleAdverts are not here: they are counts and can really jump.
  spike_window_readings: 5
  spike_thresholds:
    temperature: 1
    humidity: 2
    pressure: 3
    co2Equivalent: 100
    voc: 0.5
    iaq: 100
    mic_vol: 0.3

  # Step 1.4: gaps
  max_gap_readings: 3

  # Step 1.5: smoothing (optional; compare the model with and without it)
  smoothing:
    enabled: true
    window_seconds: 30
    sensors: [mic_vol, co2Equivalent, voc]

model:
  path: "models/model.joblib"

# Live prediction
prediction:
  extra_history_minutes: 3   # extra minutes requested before the window (for proper cleaning)
  min_confidence: 0.6        # below this, the prediction is marked as unreliable
  clock_margin_minutes: 10   # margin in case the laptop and Pi clocks do not match

# Output: for now predictions are saved locally (group decision).
output:
  predictions_path: "data/predictions/predictions.csv"
